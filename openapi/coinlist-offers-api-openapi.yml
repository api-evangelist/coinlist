openapi: 3.2.0
info:
  title: Frontline Offers API
  version: 0.1.0
servers:
- url: https://api.coinlist.co
  variables: {}
security: []
tags:
- name: Offers
paths:
  /v1/offers:
    get:
      callbacks: {}
      operationId: listPartnerOffers
      parameters:
      - description: A cursor for use in pagination
        example: g3QAAAA...
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: A cursor for use in pagination
        example: g3QAAAA...
        in: query
        name: starting_before
        required: false
        schema:
          type: string
      - description: ''
        in: query
        name: limit
        required: false
        schema:
          default: 20
          description: A limit on the number of objects to be returned
          example: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/OfferSummary'
                    type: array
                  object:
                    description: String representing the object's type. Objects of the same type share the same value.
                    enum:
                    - list
                    type: string
                  starting_after:
                    description: String representing the page cursor to used for querying the next page.
                    example: g3QAAAA...
                    type: string
                  starting_before:
                    description: String representing the page cursor to used for querying the previous page.
                    example: g3QAAAA...
                    type: string
                required:
                - object
                - data
                type: object
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: List offers for the authenticated partner
      tags:
      - Offers
  /v1/offers/{id}:
    get:
      callbacks: {}
      operationId: getPartnerOffer
      parameters:
      - description: Offer ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: Get an offer for the authenticated partner
      tags:
      - Offers
  /v1/offers/{offer_id}/addresses:
    get:
      callbacks: {}
      operationId: listOfferOptionAddresses
      parameters:
      - description: The ID of the offer
        in: path
        name: offer_id
        required: true
        schema:
          type: string
      - description: The ID of the offer option
        in: query
        name: offer_option_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/OfferOptionAddress'
                    type: array
                  object:
                    description: String representing the object's type. Objects of the same type share the same value.
                    enum:
                    - list
                    type: string
                  starting_after:
                    description: String representing the page cursor to used for querying the next page.
                    example: g3QAAAA...
                    type: string
                  starting_before:
                    description: String representing the page cursor to used for querying the previous page.
                    example: g3QAAAA...
                    type: string
                required:
                - object
                - data
                type: object
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: List the user's connected wallets for an offer option
      tags:
      - Offers
    post:
      callbacks: {}
      description: For options without a whitelisted-wallet requirement, submitting when a wallet is already connected updates the existing binding in place, keeping its id. Options with a whitelisted-wallet requirement accumulate wallets up to the requirement's max_wallets and then reject with `max_wallets_reached`.
      operationId: createOfferOptionAddress
      parameters:
      - description: The ID of the offer
        in: path
        name: offer_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferOptionAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOfferOptionAddressRequest'
        description: Offer option address params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferOptionAddress'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: Connect a proven external wallet to an offer option
      tags:
      - Offers
  /v1/offers/{offer_id}/addresses/{id}:
    delete:
      callbacks: {}
      description: Returns the removed binding. Rejected with `offer_ended` once the offer has ended; bindings on an offer that has not yet started remain deletable.
      operationId: deleteOfferOptionAddress
      parameters:
      - description: The ID of the offer
        in: path
        name: offer_id
        required: true
        schema:
          type: string
      - description: The ID of the offer option address
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferOptionAddress'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: Remove a connected external wallet from an offer option
      tags:
      - Offers
  /v1/offers/{offer_id}/allow-wallet:
    post:
      callbacks: {}
      operationId: allowWallet
      parameters:
      - description: The ID of the offer
        in: path
        name: offer_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowWalletRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllowWalletRequest'
        description: Allow wallet params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowWalletResponse'
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error response.
      security:
      - OAuth2: []
      summary: Allow a wallet address for an offer
      tags:
      - Offers
components:
  schemas:
    AllowWalletAlreadyAllowedResponse:
      properties:
        action:
          enum:
          - none
          type: string
        already_allowed:
          description: True when the wallet is already allowed and no transaction is needed.
          type: boolean
      required:
      - action
      - already_allowed
      title: AllowWalletAlreadyAllowedResponse
      type: object
    OfferOptionAddress:
      additionalProperties: false
      description: A user's proven external wallet connected to an offer option.
      properties:
        address:
          description: The connected external wallet address.
          type: string
        created_at:
          description: When the binding was created.
          example: '2025-01-01T00:00:00.000000Z'
          format: date-time
          type: string
        id:
          description: Unique identifier for the object.
          example: 05edea81-98a7-4582-aa7c-040d57cb1858
          type: string
        offer_option_id:
          description: The ID of the offer option.
          example: 05edea81-98a7-4582-aa7c-040d57cb1858
          type: string
        protocol:
          description: The protocol the binding is scoped to. An EVM address binds once per option regardless of which EVM chain proved ownership.
          enum:
          - ethereum
          - solana
          type: string
      required:
      - id
      - offer_option_id
      - address
      - protocol
      - created_at
      title: OfferOptionAddress
      type: object
    OfferOption:
      additionalProperties: false
      description: An option within an offer
      properties:
        bid_increment:
          description: Decimal string
          type:
          - string
          - 'null'
        floor_price_usd:
          description: Decimal string
          type:
          - string
          - 'null'
        id:
          description: Unique identifier for the object.
          example: 05edea81-98a7-4582-aa7c-040d57cb1858
          type: string
        minimum_purchase_usd:
          description: Decimal string
          type:
          - string
          - 'null'
        price_usd:
          description: Decimal string
          type:
          - string
          - 'null'
        sale_agreement_url:
          type:
          - string
          - 'null'
        slug:
          description: The slug identifier of the option
          type: string
        total_token_supply:
          description: Total token supply in whole tokens
          type:
          - integer
          - 'null'
      required:
      - id
      - slug
      - total_token_supply
      - price_usd
      - minimum_purchase_usd
      - floor_price_usd
      - bid_increment
      - sale_agreement_url
      title: OfferOption
      type: object
    CreateOfferOptionAddressRequest:
      additionalProperties: false
      description: 'Connects a proven external wallet to an offer option. Requires a previously

        generated, unconsumed wallet-ownership challenge for the same wallet and

        chain. The signature is verified and the single-use challenge consumed during

        ownership verification, before the bind. A rejected bind does not roll back the

        consume, so the user re-signs to retry.

        '
      properties:
        chain:
          description: The blockchain network the wallet belongs to.
          enum:
          - ethereum_sepolia
          - base_sepolia
          - solana_devnet
          - ethereum_mainnet
          - base_mainnet
          - solana_mainnet
          example: ethereum_sepolia
          type: string
        offer_option_id:
          description: The ID of the offer option to connect the wallet to.
          type: string
        signature:
          description: The cryptographic signature of the challenge message.
          example: '0xdeadbeef'
          type: string
        wallet_address:
          description: The external wallet address. For EVM chains, must be a valid Ethereum address (normalized to lowercase).
          example: '0x742d35cc6634c0532925a3b844bc9e7595f0beb1'
          type: string
      required:
      - offer_option_id
      - wallet_address
      - chain
      - signature
      title: CreateOfferOptionAddressRequest
      type: object
    AllowWalletResponse:
      discriminator:
        mapping:
          broadcast_transaction: '#/components/schemas/AllowWalletBroadcastTransactionResponse'
          none: '#/components/schemas/AllowWalletAlreadyAllowedResponse'
        propertyName: action
      oneOf:
      - $ref: '#/components/schemas/AllowWalletBroadcastTransactionResponse'
      - $ref: '#/components/schemas/AllowWalletAlreadyAllowedResponse'
      title: AllowWalletResponse
    Error:
      additionalProperties: false
      properties:
        code:
          description: A human-readable message providing more details about the error.
          type: string
        errors:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        event_id:
          description: The unique identifier for the error event. This is useful for tracking and debugging.
          type: string
        message:
          description: For some errors that could be handled programmatically, a short string indicating the error code reported.
          type: string
        type:
          description: The type of error returned. One of `api_error`, `invalid_request_error`
          enum:
          - api_error
          - invalid_request_error
          type: string
      required:
      - type
      - message
      title: Error
      type: object
    AllowWalletRequest:
      allOf:
      - $ref: '#/components/schemas/VerifyOwnershipRequest'
      description: 'Verifies wallet ownership via a previously generated challenge, then checks if the wallet

        is already allowed for the offer. If already allowed, returns 200 with an empty JSON object.

        Otherwise starts the supplier verification process and returns an encoded transaction

        to broadcast.

        '
      title: AllowWalletRequest
      type: object
    VerifyOwnershipRequest:
      description: Parameters consumed by VerifyOwnershipPlug to verify wallet ownership.
      properties:
        chain:
          description: The blockchain network the wallet belongs to.
          enum:
          - ethereum_sepolia
          - base_sepolia
          - solana_devnet
          - ethereum_mainnet
          - base_mainnet
          - solana_mainnet
          example: ethereum_sepolia
          type: string
        signature:
          description: The cryptographic signature of the challenge message.
          example: '0xdeadbeef'
          type: string
        wallet_address:
          description: The wallet address to verify. For EVM chains, must be a valid Ethereum address (normalized to lowercase).
          example: '0x742d35cc6634c0532925a3b844bc9e7595f0beb1'
          type: string
      required:
      - wallet_address
      - chain
      - signature
      title: VerifyOwnershipRequest
      type: object
    AllowWalletBroadcastTransactionResponse:
      properties:
        action:
          enum:
          - broadcast_transaction
          type: string
        data:
          description: The encoded transaction to broadcast on-chain to complete wallet allowlisting.
          type: string
        to:
          description: The contract address to submit the transaction to.
          type: string
      required:
      - action
      - to
      - data
      title: AllowWalletBroadcastTransactionResponse
      type: object
    Offer:
      additionalProperties: false
      description: Full offer details
      properties:
        about:
          description: About text for the offer (English)
          type:
          - string
          - 'null'
        asset:
          additionalProperties: false
          description: The asset for which the offer is created
          properties:
            code:
              description: The asset code (symbol)
              type: string
            fractional_digits:
              description: The number of fractional digits for the asset
              type: integer
            id:
              description: The asset ID
              type: string
            name:
              description: The asset name
              type: string
          required:
          - id
          - code
          - name
          - fractional_digits
          type: object
        banner_url:
          description: The URL for the offer banner. Null for offer types that don't require one (e.g. ondo::swap).
          format: uri
          type:
          - string
          - 'null'
        category:
          description: The category of the offer
          type: string
        ends_at:
          description: When the offer ends. Null when the offer has no end date
          example: '2025-01-01T00:00:00.000000Z'
          format: date-time
          type:
          - string
          - 'null'
        faqs:
          description: List of FAQs for the offer
          items:
            additionalProperties: false
            properties:
              answer:
                type: string
              question:
                type: string
            required:
            - question
            - answer
            type: object
          type: array
        funding_assets:
          description: List of assets that can be used to fund the offer
          items:
            additionalProperties: false
            properties:
              code:
                description: The asset code (symbol)
                type: string
              fractional_digits:
                description: The number of fractional digits for the asset
                type: integer
              id:
                description: The asset ID
                type: string
              name:
                description: The asset name
                type: string
            required:
            - id
            - code
            - name
            - fractional_digits
            type: object
          type: array
        id:
          description: Unique identifier for the object.
          example: 05edea81-98a7-4582-aa7c-040d57cb1858
          type: string
        links:
          description: List of links related to the offer
          items:
            additionalProperties: false
            properties:
              label:
                type: string
              url:
                type: string
            required:
            - label
            - url
            type: object
          type: array
        logo_url:
          description: The URL for the offer logo
          format: uri
          type: string
        milestones:
          description: List of milestones for the offer
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              schedule:
                type: string
              status:
                enum:
                - completed
                - active
                - upcoming
                type: string
            required:
            - name
            - schedule
            - status
            type: object
          type: array
        name:
          description: The name of the offer
          type: string
        object:
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - offer
          type: string
        options:
          description: List of offer options
          items:
            $ref: '#/components/schemas/OfferOption'
          type: array
        slug:
          description: The slug identifier of the offer
          example: example-offer
          type: string
        starts_at:
          description: When the offer starts
          example: '2025-01-01T00:00:00.000000Z'
          format: date-time
          type:
          - string
          - 'null'
        tagline:
          description: Tagline text for the offer (English). Null for offer types that don't require one (e.g. ondo::swap).
          type:
          - string
          - 'null'
        terms:
          description: List of offer terms
          items:
            additionalProperties: false
            properties:
              key:
                type: string
              value:
                type: string
            required:
            - key
            - value
            type: object
          type: array
        tokens:
          description: Tokens involved in the offer by role — funding token(s) plus the distribution/swap token — each keyed by chain + address
          items:
            additionalProperties: false
            properties:
              address:
                description: The token contract address
                type: string
              chain:
                description: The chain the token is on
                enum:
                - ethereum_sepolia
                - base_sepolia
                - solana_devnet
                - ethereum_mainnet
                - base_mainnet
                - solana_mainnet
                type: string
              role:
                description: The token's role in the offer
                enum:
                - funding
                - distribution
                - swap
                type: string
            required:
            - role
            - chain
            - address
            type: object
          type: array
        type:
          description: Offer type
          enum:
          - coinlist::token_sale
          - superstate::swap
          - ondo::swap
          example: coinlist::token_sale
          type: string
      required:
      - object
      - id
      - slug
      - name
      - type
      - category
      - tagline
      - about
      - starts_at
      - ends_at
      - logo_url
      - banner_url
      - options
      - terms
      - links
      - faqs
      - milestones
      - asset
      - funding_assets
      - tokens
      title: Offer
      type: object
    OfferSummary:
      additionalProperties: false
      description: Offer summary
      properties:
        banner_url:
          description: The URL for the offer banner. Null for offer types that don't require one (e.g. ondo::swap).
          format: uri
          type:
          - string
          - 'null'
        ends_at:
          description: When the offer ends. Null when the offer has no end date
          example: '2025-01-01T00:00:00.000000Z'
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: Unique identifier for the object.
          example: 05edea81-98a7-4582-aa7c-040d57cb1858
          type: string
        logo_url:
          description: The URL for the offer logo
          format: uri
          type: string
        object:
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
          - offer
          type: string
        options:
          description: List of offer options
          items:
            $ref: '#/components/schemas/OfferOption'
          type: array
        slug:
          description: The slug identifier of the offer
          example: example-offer
          type: string
        starts_at:
          description: When the offer starts
          example: '2025-01-01T00:00:00.000000Z'
          format: date-time
          type:
          - string
          - 'null'
        tagline:
          description: Tagline text for the offer (English). Null for offer types that don't require one (e.g. ondo::swap).
          example: Example Offer Tagline
          type:
          - string
          - 'null'
        type:
          description: Offer type
          enum:
          - coinlist::token_sale
          - superstate::swap
          - ondo::swap
          example: coinlist::token_sale
          type: string
      required:
      - object
      - id
      - slug
      - type
      - tagline
      - starts_at
      - ends_at
      - logo_url
      - banner_url
      - options
      title: OfferSummary
      type: object
  securitySchemes:
    OAuth2:
      description: OAuth 2.0 authorization and token endpoints
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          refreshUrl: /oauth/token
          scopes: {}
          tokenUrl: /oauth/token
        clientCredentials:
          refreshUrl: /oauth/token
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
    TokenAuth:
      description: Session token for user authentication during OAuth authorization
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: CoinList
  source: https://docs.passage.coinlist.co/api-reference/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
