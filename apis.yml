aid: coinlist
name: CoinList
description: >-
  CoinList is a fintech platform for the token economy - it runs compliant token
  sales, tokenized equities, trading, staking, and wallet services for crypto
  projects and investors. Its developer surface is Passage (the "Frontline API"),
  a partner API that lets third parties embed CoinList-managed token sales and
  tokenized equities directly inside their own apps: OAuth 2.0 (PKCE) partner and
  user authentication, Sumsub KYC token issuance, tax-document signing, offers,
  eligibility requirements, participations, wallet ownership proof and
  allow-listing, and on-chain swap/token reads. Passage runs the regulated
  infrastructure and back office; the partner focuses on the product. Shipped with
  a React SDK (@coinlist-co/react) of UI components, hooks, and server helpers.
  Added to the API Evangelist network from the electric-capital and polychain
  portfolios and enriched from CoinList's public developer surface.
